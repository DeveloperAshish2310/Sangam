# Sangam at http://192.168.1.101/unified-ChatBox/
#
# These `location` blocks go INSIDE the existing default server (the `server_name _;` block in
# /etc/nginx/sites-enabled/default). Install:
#   sudo cp deploy/nginx-sangam.conf /etc/nginx/snippets/sangam.conf
#   sudo nano /etc/nginx/sites-enabled/default      # add:  include snippets/sangam.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
#   /unified-ChatBox/api/...  -> Sangam API (127.0.0.1:8787, prefix removed)
#   /unified-ChatBox/...      -> Sangam web (127.0.0.1:8888, built with SANGAM_BASE=/unified-ChatBox/)
#
# `^~` matters: it stops the site's `\.php$` / static-file rules from ever handling these paths.

location = /unified-ChatBox {
	return 301 /unified-ChatBox/;
}

# Live updates: a long-lived event stream — no buffering, no timeout cut.
location = /unified-ChatBox/api/events {
	proxy_pass http://127.0.0.1:8787/api/events;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_buffering off;
	proxy_cache off;
	proxy_read_timeout 24h;
}

location ^~ /unified-ChatBox/api/ {
	proxy_pass http://127.0.0.1:8787/api/;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	# Uploads: Sangam allows 25 MB per message, plus form overhead.
	client_max_body_size 30m;
	# Videos stream in pieces straight from Telegram: pass them through as they arrive.
	proxy_buffering off;
	proxy_read_timeout 300s;
}

location ^~ /unified-ChatBox/ {
	proxy_pass http://127.0.0.1:8888;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
