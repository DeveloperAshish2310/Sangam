<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sangam is offline</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; --bg: #f8f6f1; --fg: #1d2330; --muted: #6b7280; --card: #ffffff; --border: #e5e2da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141a24; --fg: #eef0f4; --muted: #9aa3b2; --card: #1b2230; --border: #2a3242; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
      font: 15px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 360px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; }
    img { width: 64px; height: 64px; }
    h1 { margin: 16px 0 4px; font-size: 18px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    code { font-size: 13px; }
    button { margin-top: 20px; width: 100%; border: 0; border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: #d4452b; cursor: pointer; }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.svg" alt="" />
    <h1>Sangam isn't running</h1>
    <p>Sangam runs on your own computer. Start it with <code>npm run start:local</code>, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    // Comes back by itself once the server is up again.
    setInterval(() => fetch("./", { cache: "no-store" }).then((r) => r.ok && location.reload()).catch(() => {}), 5000);
  </script>
</body>
</html>
